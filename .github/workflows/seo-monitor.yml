name: Free clinic website SEO health check

on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-site-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check public clinic pages and sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          import time, urllib.request, urllib.error, xml.etree.ElementTree as ET
          base = "https://newlife-dental-clinic-website.vercel.app"
          def fetch(path):
              last = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(base + path, headers={"User-Agent":"NewlifeClinicHealthCheck/1.0"})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          if response.status != 200:
                              raise RuntimeError(f"HTTP {response.status}")
                          return response.read()
                  except Exception as e:
                      last = e
                      if attempt < 2: time.sleep(10)
              raise RuntimeError(f"{path}: {last}")
          sitemap = fetch("/sitemap.xml")
          root = ET.fromstring(sitemap)
          ns = {"s":"http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [x.text for x in root.findall(".//s:loc",ns)]
          if not urls or any(not u.startswith(base+"/") for u in urls):
              raise RuntimeError("Sitemap missing URLs or contains unexpected host")
          robots = fetch("/robots.txt").decode("utf-8")
          if "Sitemap: " + base + "/sitemap.xml" not in robots:
              raise RuntimeError("robots.txt sitemap reference mismatch")
          for url in urls:
              path = url[len(base):]
              fetch(path)
              print("PASS",path)
          print(f"PASS: {len(urls)} sitemap pages, sitemap and robots.txt")
          PY
